version: 2
project_name: slack-tui

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: slack-tui
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - slack-app-manifest.yaml

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto

# Publishes the cask to kurenn/homebrew-tap on each release (macOS; Linux
# users have install.sh). Needs the HOMEBREW_TAP_TOKEN repo secret (a
# fine-grained PAT with contents:write on the tap repo) — the default
# GITHUB_TOKEN can't push across repos.
homebrew_casks:
  - repository:
      owner: kurenn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/kurenn/slack-tui
    description: A keyboard-first terminal Slack client
