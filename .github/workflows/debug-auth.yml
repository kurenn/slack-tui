name: debug-auth
on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
          echo "HOMEBREW_TAP_TOKEN length: ${#HOMEBREW_TAP_TOKEN}"
          echo "gh-token GET repo:      $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/kurenn/slack-tui)"
          echo "gh-token POST releases: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $GITHUB_TOKEN" -d '{}' https://api.github.com/repos/kurenn/slack-tui/releases)"
          echo "tap-token GET tap:      $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $HOMEBREW_TAP_TOKEN" https://api.github.com/repos/kurenn/homebrew-tap)"
