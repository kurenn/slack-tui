# slack-tui — Slack app manifest
#
# Setup:
#   1. https://api.slack.com/apps → Create New App → From an app manifest
#   2. Pick your workspace → paste this YAML → Next → Create.
#   3. Basic Information → App-Level Tokens → Generate Token and Scopes:
#        name "socket", scope connections:write → Generate → copy the xapp-… token.
#   4. Install App → Install to Workspace → Allow.
#   5. In Slack, `/invite @slack-tui` in any channel you want live (Socket Mode
#      only streams channels/DMs the app is a member of; personal DMs are polled).
#
# Two ways to get the user/bot tokens:
#   A) Browser sign-in (recommended): Basic Information → copy the Client ID and
#      Client Secret into env (SLACK_CLIENT_ID / SLACK_CLIENT_SECRET) or
#      ~/.config/slack-tui/oauth.json, then run `slack-tui login` (or pick
#      "Sign in with Slack" in onboarding). The redirect_url below must be
#      registered (it is, via this manifest).
#   B) Manual: OAuth & Permissions → copy the User OAuth Token (xoxp-…) and Bot
#      User OAuth Token (xoxb-…) and paste them in onboarding / set as env vars.
#
# The app-level token (xapp-…, step 3) is for Socket Mode only and is never issued
# by OAuth — provide it via SLACK_APP_TOKEN or the onboarding token form.

display_information:
  name: slack-tui
  description: A keyboard-first terminal Slack client
  background_color: "#0d1117"

features:
  bot_user:
    display_name: slack-tui
    always_online: false

oauth_config:
  redirect_urls:
    - http://localhost:9899/callback   # loopback target for `slack-tui login`
  scopes:
    user:
      - channels:history
      - channels:read
      - channels:join        # browse & join channels (palette)
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - users:read
      - chat:write
      - reactions:read
      - reactions:write       # add/remove reactions (`a`)
      - users:write           # set presence (active/away)
      - dnd:write             # Do Not Disturb (snooze)
      - users.profile:write   # custom status message
      - search:read           # workspace message search (`s`)
    bot:
      - channels:history
      - channels:read
      - groups:history
      - im:history
      - mpim:history
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
