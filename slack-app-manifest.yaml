# slack-tui — Slack app manifest
#
# Setup:
#   1. https://api.slack.com/apps → Create New App → From an app manifest
#   2. Pick your workspace → paste this YAML → Next → Create.
#   3. Basic Information → App-Level Tokens → Generate Token and Scopes:
#        name "socket", scope connections:write → Generate → copy the xapp-… token.
#   4. Install App → Install to Workspace → Allow.
#   5. In Slack, `/invite @slack-tui` in any channel you want live (Socket Mode
#      only streams channels/DMs the app is a member of; personal DMs are polled).
#
# You only need your own app for Socket Mode (live unread) or if you'd rather not
# use the published slack-tui app — a plain install signs in with `slack-tui
# login` out of the box, no app and no credentials required.
#
# Two ways to get the user/bot tokens from your own app:
#   A) Browser sign-in (recommended): Basic Information → copy the Client ID and
#      Client Secret into env (SLACK_CLIENT_ID / SLACK_CLIENT_SECRET) or
#      ~/.config/slack-tui/oauth.json, then run `slack-tui login` (or pick
#      "Sign in with Slack" in onboarding). The redirect_url below must be
#      registered (it is, via this manifest).
#   B) Manual: OAuth & Permissions → copy the User OAuth Token (xoxp-…) and Bot
#      User OAuth Token (xoxb-…) and paste them in onboarding / set as env vars.
#
# The app-level token (xapp-…, step 3) is for Socket Mode only and is never issued
# by OAuth — provide it via SLACK_APP_TOKEN or the onboarding token form.
#
# Deliberately NO `pkce_enabled: true` here, though the published slack-tui app
# does set it. PKCE turns the app into a public client (no client secret), but
# Slack then treats the loopback redirect as a desktop redirect, and desktop
# redirects may not request bot scopes — which kills Socket Mode, the main reason
# to run your own app. It is also a one-way switch: it cannot be turned off
# without contacting Slack support. Omit the client secret and slack-tui runs
# PKCE against this app anyway; supply the secret and it keeps the bot scopes.

display_information:
  name: slack-tui
  description: A keyboard-first terminal Slack client
  background_color: "#0d1117"

features:
  bot_user:
    display_name: slack-tui
    always_online: false

oauth_config:
  # Loopback targets for `slack-tui login`. It binds the first free port in this
  # range, so all of them must be registered — Slack matches the redirect URL by
  # prefix, and the port is part of that prefix.
  redirect_urls:
    - http://localhost:9899/callback
    - http://localhost:9900/callback
    - http://localhost:9901/callback
    - http://localhost:9902/callback
    - http://localhost:9903/callback
  scopes:
    user:
      - channels:history
      - channels:read
      - channels:write       # browse & join channels + mark public channels read
      - groups:history
      - groups:read
      - groups:write         # mark private channels read (conversations.mark)
      - im:history
      - im:read
      - im:write             # open DMs + mark DMs read (conversations.mark)
      - mpim:history
      - mpim:read
      - mpim:write           # mark group DMs read (conversations.mark)
      - users:read
      - chat:write
      - files:read            # download files
      - files:write           # attach/upload files
      - reactions:read
      - reactions:write       # add/remove reactions (`a`)
      - users:write           # set presence (active/away)
      - dnd:write             # Do Not Disturb (snooze)
      - users.profile:write   # custom status message
      - search:read           # workspace message search (`s`)
    bot:
      - channels:history
      - channels:read
      - groups:history
      - im:history
      - mpim:history
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
