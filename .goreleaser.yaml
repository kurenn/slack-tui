version: 2
project_name: slack-tui

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: slack-tui
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # Public release binaries deliberately ship with NO client ID: slack-tui is
    # not distributed through Slack, and an undistributed app installs only in
    # the workspace that owns it, so a baked-in ID would fail for everyone else.
    # Every user creates their own app via `slack-tui setup`.
    #
    # SLACK_APP_CLIENT_ID stays wired up for private builds — an org that
    # creates one app for its own workspace can stamp it and hand teammates a
    # binary that signs in with no setup at all.
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/kurenn/slack-tui/internal/config.DefaultClientID={{ envOrDefault "SLACK_APP_CLIENT_ID" "" }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - slack-app-manifest.yaml
      - slack-app-manifest.json

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto

# Publishes a formula to kurenn/homebrew-tap on each release. Deliberately a
# formula and NOT the newer homebrew_casks: casks run Gatekeeper on install,
# which blocks our unsigned (not notarized) binaries — formulae install
# without quarantine, the standard path for Go CLIs. Needs the
# HOMEBREW_TAP_TOKEN repo secret (a fine-grained PAT with contents:write on
# the tap repo) — the default GITHUB_TOKEN can't push across repos.
brews:
  - repository:
      owner: kurenn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/kurenn/slack-tui
    description: A keyboard-first terminal Slack client
    license: MIT
    test: |
      system "#{bin}/slack-tui", "--version"
