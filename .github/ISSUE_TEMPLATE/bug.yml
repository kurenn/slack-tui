name: Bug report
description: Something broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`slack-tui doctor` output"
      description: >
        Run `slack-tui doctor` and paste the output — it covers version,
        config locations, token sources, and scopes (tokens are masked).
      render: text
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal & OS
      placeholder: "Ghostty 1.2 / macOS 26"
    validations:
      required: false
